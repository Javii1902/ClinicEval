[pytest]
# Creating/destroying several tk.Tk() root windows within one process (once
# per test that needs a real Dashboard/Clinic/NewAssessment widget) is
# occasionally flaky in Tcl/Tk itself - a handful of tests can intermittently
# fail with a TclError that has nothing to do with the code under test and
# doesn't reproduce when the same test is run alone. Auto-retrying covers
# that without masking real, consistent failures (a genuine bug still fails
# on every attempt).
addopts = --reruns 2 --reruns-delay 1
